<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="EV Station PluZ Solution by Entech Energy — แพ็กเกจสถานีชาร์จเร็ว DC พร้อมราคา สเปก และเปรียบเทียบ">
<meta name="theme-color" content="#0089d1">
<link rel="icon" href="img/logo.webp">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Entech EV Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a showroom catalog — dark field cut by Entech's green diagonals, products shown on pale "stage" plates; bottom tabs on phone, top bar on iPad */
:root{
  --bg:#070a09; --panel:#0f1513; --panel-2:#151d1a; --line:#24322c;
  --fg:#eef3f0; --muted:#93a59d; --dim:#62736b;
  --green:#75c188; --green-2:#4fa766; --green-ink:#06140c; --green-soft:rgba(117,193,136,.14);
  --blue:#3aa6ea; --ci-blue:#0089d1; --ci-green:#75c188; --grad:linear-gradient(105deg,#0089d1 0%,#2b9fb0 55%,#75c188 100%);
  --stage:#e9eeeb; --stage-2:#d7dfdb; --stage-ink:#0b120f;
  --sc:#f26a1b; --sg:#3d93ff; --warn:#f3b23a; --best:#75c188;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  --f-disp:"Chakra Petch","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Thai","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabh:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f6f4; --panel:#ffffff; --panel-2:#eaf0ed; --line:#d4ddd8;
  --fg:#0c1512; --muted:#53645c; --dim:#7d8c85;
  --green:#2f8a4c; --green-2:#256f3c; --green-ink:#ffffff; --green-soft:rgba(117,193,136,.16); --blue:#0079ba;
  --stage:#eef2f0; --stage-2:#dfe6e2; --stage-ink:#0b120f;
  --sc:#d9560c; --sg:#1f74e0; --warn:#b77900; --best:#2f8a4c;
  --shadow:0 16px 34px -20px rgba(10,30,20,.35); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f6f4; --panel:#ffffff; --panel-2:#eaf0ed; --line:#d4ddd8;
  --fg:#0c1512; --muted:#53645c; --dim:#7d8c85;
  --green:#2f8a4c; --green-2:#256f3c; --green-ink:#ffffff; --green-soft:rgba(117,193,136,.16); --blue:#0079ba;
  --stage:#eef2f0; --stage-2:#dfe6e2; --stage-ink:#0b120f;
  --sc:#d9560c; --sg:#1f74e0; --warn:#b77900; --best:#2f8a4c;
  --shadow:0 16px 34px -20px rgba(10,30,20,.35); color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.08}
h2{font-size:clamp(26px,4.4vw,40px);font-weight:700}
h3{font-size:19px;font-weight:600}
.eyebrow{font-family:var(--f-disp);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- top bar / tabs ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;letter-spacing:.06em;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.logo img{height:30px;width:auto;display:block}
.logo span{border-left:1px solid var(--line);padding-left:10px}
.logo span{color:var(--muted);font-weight:500;letter-spacing:.04em}
.topnav{display:none;gap:4px;margin-left:auto}
.topnav a{white-space:nowrap;padding:8px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;position:relative}
.topnav a[aria-current="page"]{color:var(--fg);background:var(--panel-2)}
.top-tools{display:flex;gap:6px;margin-left:auto}
.topnav + .top-tools{margin-left:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;position:relative}
.icon-btn svg{width:19px;height:19px}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--green);color:var(--green-ink);font:700 11px/19px var(--f-disp);text-align:center}
.badge:empty,.badge[data-n="0"]{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:55;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--dim);text-decoration:none;font-size:10.5px;white-space:nowrap;font-weight:500;position:relative;min-height:52px}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--green)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:-6px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
.tabs .badge{top:2px;right:calc(50% - 22px)}
@media (min-width:760px){
  :root{--tabh:0px}
  .tabs{display:none}
  .topnav{display:flex}
  .top .wrap{height:66px}
}

/* ---------- views ---------- */
.view{display:none;padding-block:22px 48px}
.view.on{display:block;animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.vhead p{margin:6px 0 0;color:var(--muted);max-width:52ch}

/* ---------- hero (home) ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .slab{position:absolute;inset:0 0 auto;height:470px;pointer-events:none}
@media (min-width:900px){.hero .slab{height:auto;bottom:0}}
@media (max-width:1000px){.logo span{display:none}}
.hero .slab i{position:absolute;top:-20%;height:140%;transform:skewX(-18deg);background:var(--grad)}
.hero .slab i:nth-child(1){right:-8%;width:34%;opacity:.95}
.hero .slab i:nth-child(2){right:29%;width:5%;opacity:.55}
.hero .slab i:nth-child(3){right:37%;width:1.4%;opacity:.35}
.hero-in{position:relative;display:grid;gap:8px;padding-block:28px 26px}
.hero-type{position:relative;font-family:var(--f-disp);font-weight:700;line-height:.86;letter-spacing:-.03em;margin:4px 0 0}
.hero-type .ol{display:block;font-size:clamp(58px,15.5vw,150px);color:transparent;-webkit-text-stroke:2px var(--fg);opacity:.9;white-space:nowrap}
.hero-type .so{display:block;font-size:clamp(46px,12.5vw,118px);margin-top:.02em;white-space:nowrap}
.hero-type .by{display:flex;align-items:center;gap:10px;margin-top:14px;font:600 clamp(16px,3.6vw,22px)/1.2 var(--f-disp);letter-spacing:.02em;color:var(--muted)}
.hero-type .by b{color:var(--ci-blue)}
.cobrand{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.cobrand .lg{background:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;box-shadow:var(--shadow)}
.cobrand .lg img{height:40px;width:auto;display:block}
.cobrand .lg.ev img{height:46px}
.cobrand .x{font:600 18px var(--f-disp);color:var(--muted)}
.hero-type .so b{color:var(--green)}
.hero-art{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2%;min-height:220px;margin-top:-30px}
.hero-art::before{content:"";position:absolute;left:4%;right:4%;bottom:4%;height:26%;border:2px solid var(--fg);border-radius:50%;opacity:.55}
.hero-art img{position:relative;height:clamp(200px,44vw,380px);width:auto;object-fit:contain;filter:drop-shadow(0 26px 24px rgba(0,0,0,.45))}
.hero-art img.s{height:clamp(170px,37vw,320px)}
.hero-art .tag{position:absolute;left:50%;bottom:0;transform:translate(-50%,40%);background:var(--bg);padding:2px 10px;font:600 12px var(--f-disp);letter-spacing:.08em;border-radius:99px}
.hero-copy{display:grid;gap:14px;max-width:560px}
.hero-copy p{margin:0;color:var(--muted);font-size:16px}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:6px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font:700 clamp(22px,4vw,30px)/1.1 var(--f-disp)}
.stat .bar{height:3px;background:var(--line);margin-top:8px;border-radius:2px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--fg)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:4px;font-weight:600;text-decoration:none;border:1.5px solid transparent;white-space:nowrap}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.green{background:var(--green);color:var(--green-ink)}
.btn.ghost{border-color:var(--fg);color:var(--fg);background:transparent}
.btn.line{border-color:var(--line);background:var(--panel);color:var(--fg)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn svg{width:18px;height:18px}
@media (min-width:900px){
  .hero-in{grid-template-columns:1.05fr 1fr;align-items:center;padding-block:40px 44px}
  .hero-type{grid-column:1;grid-row:1}
  .hero-art{grid-column:2;grid-row:1 / span 2;margin-top:0;min-height:420px}
  .hero-copy{grid-column:1}
}
.section{padding-block:34px 10px}
.archs{display:grid;gap:14px;margin-top:18px}
@media (min-width:760px){.archs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.arch{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start}
.arch svg{width:100%;height:auto;display:block;background:var(--panel-2);border-radius:10px}
.arch .who{font-size:13px;color:var(--green);font-weight:500}
.arch ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.arch li{padding-left:20px;position:relative}
.arch li::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;background:var(--green);clip-path:polygon(30% 0,100% 0,70% 100%,0 100%)}
.arch li.minus{color:var(--muted)}
.arch li.minus::before{background:var(--dim);clip-path:none;height:2px;top:.75em}
.svg-box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.svg-t{fill:var(--fg);font:600 14px var(--f-body)}
.svg-s{fill:var(--muted);font:500 12px var(--f-body)}
.svg-acc{fill:var(--green)}
.svg-sg{fill:var(--sg)}
.flow{fill:none;stroke:var(--green);stroke-width:2.5;stroke-dasharray:6 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.tierlad{display:grid;gap:8px;margin-top:16px}
.rung{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--fg)}
.rung .kw{font:700 26px/1 var(--f-disp)}
.rung .kw small{font-size:13px;color:var(--muted);margin-left:2px}
.rung .meta{font-size:13px;color:var(--muted);min-width:0}
.rung .meta b{color:var(--fg);font-weight:600}
.rung .from{text-align:right;font-size:12px;color:var(--muted)}
.rung .from b{display:block;color:var(--fg);font:700 16px var(--f-disp)}

/* ---------- toolbar / filters ---------- */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:500;white-space:nowrap}
.seg button small{color:var(--muted);font-size:12px;margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.7}
.toolbar{display:grid;gap:10px;margin-bottom:18px;position:relative;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:20;background:var(--bg);padding-block:10px;margin-top:-10px}
@media (min-width:760px){.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px)}}
.tb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb-row .grow{flex:1 1 auto}
.sel{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:14px}
.count{font-size:13px;color:var(--muted)}
.chipf{min-height:36px;padding:0 12px;border-radius:999px;border:1px dashed var(--line);background:transparent;font-size:13px}
.chipf[aria-pressed="true"]{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--fg)}

/* ---------- pack cards ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pcard-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.pno{font:700 26px/1 var(--f-disp);letter-spacing:-.02em}
.pno small{display:block;font:600 10px var(--f-disp);letter-spacing:.14em;color:var(--muted);margin-bottom:2px}
.pcard-h .arch-n{font-size:12px;color:var(--muted);line-height:1.3;min-width:0}
.pcard-h .arch-n b{display:block;color:var(--fg);font-weight:600;font-size:13px}
.bchip{margin-left:auto;flex:none;font:600 11px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid currentColor}
.bchip.sc{color:var(--sc)} .bchip.sg{color:var(--sg)}
.stage{position:relative;background:linear-gradient(180deg,var(--stage),var(--stage-2));display:flex;align-items:flex-end;justify-content:center;gap:4%;padding:16px 12px 10px;height:190px}
.stage::after{content:"";position:absolute;left:12%;right:12%;bottom:12px;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.22),transparent)}
.stage figure{margin:0;position:relative;height:100%;display:flex;align-items:flex-end;z-index:1}
.stage img{height:100%;width:auto;max-width:100%;object-fit:contain}
.stage figure.minor{height:78%}
.stage .x{position:absolute;right:-6px;top:4px;background:var(--stage-ink);color:#fff;font:700 13px/1 var(--f-disp);padding:5px 7px;border-radius:6px}
.stage .ill{position:absolute;left:8px;bottom:8px;font-size:10px;color:#4c5a53;background:rgba(255,255,255,.75);padding:2px 6px;border-radius:4px;z-index:2}
.pcard-b{padding:14px;display:grid;gap:12px;flex:1;align-content:start}
.cfg{font-weight:600;font-size:15px;line-height:1.35}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv3 div{background:var(--panel-2);border-radius:10px;padding:8px 10px}
.kv3 small{display:block;font-size:11px;color:var(--muted)}
.kv3 b{font:700 18px/1.15 var(--f-disp)}
.kv3 b em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.price{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.price .p{font:700 26px/1 var(--f-disp)}
.price .p small{display:block;font:500 11px var(--f-body);color:var(--muted);margin-bottom:4px}
.price .pu{text-align:right;font-size:12px;color:var(--muted);line-height:1.5}
.price .pu b{color:var(--fg);font-family:var(--f-disp)}
.pcard-f{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:0 14px 14px}
.tbtn{min-height:42px;min-width:42px;border-radius:4px;border:1.5px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;padding:0 10px}
.tbtn svg{width:18px;height:18px}
.tbtn[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.tbtn.star[aria-pressed="true"] svg{fill:currentColor}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* ---------- models ---------- */
.mgroup{margin-bottom:28px}
.mgroup header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
@media (min-width:600px){.mgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.mcard .stage{height:170px;padding:12px 10px 8px}
.mcard .bd{padding:12px;display:grid;gap:4px}
.mcard .nm{font:600 15px/1.25 var(--f-disp)}
.mcard .ty{font-size:12px;color:var(--muted)}
.mcard .pw{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:4px}
.mcard .pw b{font:700 20px var(--f-disp)}
.mcard .pw span{font-size:12px;color:var(--muted);font-family:var(--f-disp)}

/* ---------- sheet (detail) ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:81;left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);background:var(--bg);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:none}
@media (min-width:760px){
  .sheet{left:auto;top:0;bottom:0;right:0;width:min(720px,92vw);max-height:none;border-radius:0;border:0;border-left:1px solid var(--line);transform:translateX(105%);
    padding-top:env(safe-area-inset-top,0px)}
}
.sh-top{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex:none}
.grab{position:absolute;top:6px;left:50%;width:40px;height:4px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
@media (min-width:760px){.grab{display:none}}
.sh-top h3{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-top .icon-btn{margin-left:auto;flex:none}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.sh-pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:linear-gradient(180deg,var(--stage),var(--stage-2))}
.gallery::-webkit-scrollbar{display:none}
.gallery .stage{flex:0 0 100%;scroll-snap-align:center;height:300px;background:none}
@media (min-width:760px){.gallery .stage{height:360px}}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0 0}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s}
.dots i.on{width:18px;background:var(--green)}
.dhead{display:grid;gap:6px;padding-block:18px 6px}
.dhead .big{font:700 clamp(30px,7vw,44px)/1 var(--f-disp);letter-spacing:-.02em}
.dhead .big .ol{color:transparent;-webkit-text-stroke:1.5px var(--fg)}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-block:14px}
.dprice{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.dprice .p{font:700 32px/1 var(--f-disp)}
.dprice .p small{display:block;font:500 12px var(--f-body);color:var(--muted);margin-bottom:6px}
.dprice .pu{font-size:13px;color:var(--muted);display:grid;gap:2px;text-align:right}
.dprice .pu b{color:var(--fg);font-family:var(--f-disp)}
.note{font-size:12px;color:var(--dim);margin-top:8px}
.dsec{padding-block:18px 0;display:grid;gap:10px}
.dsec h4{margin:0;font:600 13px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hl li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 38px;position:relative;font-size:14px}
.hl li::before{content:"";position:absolute;left:14px;top:15px;width:12px;height:12px;background:var(--green);clip-path:polygon(30% 0,100% 0,70% 100%,0 100%)}
.fit{background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:12px;padding:12px 14px;font-size:14px}
.fit b{color:var(--green)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td,tr:last-child th{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
thead th{font-size:12px;color:var(--muted);font-weight:500}
tfoot td{font-weight:700;font-family:var(--f-disp);font-size:16px}
.spec th{width:38%;color:var(--muted);font-weight:500}
.sib{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sib button{flex:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;min-width:170px}
.sib button[aria-current="true"]{border-color:var(--green)}
.sib b{display:block;font:700 15px var(--f-disp)}
.sib span{font-size:12px;color:var(--muted)}
.dact{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:20px 0}
.dact .btn{width:100%}

/* ---------- compare ---------- */
.ctabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.ctabs button{min-height:36px;padding:0 16px;border-radius:999px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.ctabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.cmp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.cmp{min-width:100%;table-layout:fixed}
.cmp col.lab{width:118px}
@media (min-width:600px){.cmp col.lab{width:190px}}
.cmp col.it{width:170px}
.cmp th.lab,.cmp td.lab{position:sticky;left:0;background:var(--panel);z-index:2;color:var(--muted);font-weight:500;font-size:13px;border-right:1px solid var(--line)}
.cmp thead th{vertical-align:bottom;background:var(--panel);padding:10px}
.cmp thead .stage{height:120px;border-radius:10px;padding:8px}
.cmp .hn{display:flex;justify-content:space-between;gap:6px;align-items:flex-start;margin-top:8px}
.cmp .hn b{font:700 15px/1.2 var(--f-disp);color:var(--fg)}
.cmp .hn button{border:0;background:transparent;color:var(--muted);width:30px;height:30px;flex:none;border-radius:8px}
.cmp tr.grp td{background:var(--panel-2);font:600 11px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:7px 12px}
.cmp tr.grp td.lab{background:var(--panel-2)}
.cmp td{font-size:14px}
.cmp td.best{color:var(--best);font-weight:600}
.cmp td.best::after{content:" ★";font-size:11px}
.cmp tr.same td:not(.lab){color:var(--dim)}
.cmp .mbar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.cmp .mbar i{display:block;height:100%;background:var(--green)}
.cmp-empty{display:grid;gap:14px;justify-items:start;padding:22px;border:1px dashed var(--line);border-radius:14px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:13px}
.pick button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.pick button b{font-family:var(--f-disp);margin-right:4px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;min-height:40px}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;margin:0;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{transform:translateX(16px);background:var(--green-ink)}

/* compare tray */
.tray{position:fixed;z-index:56;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);transform:translate(-50%,160%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);max-width:calc(100% - 32px)}
.tray{visibility:hidden}
.tray.on{transform:translate(-50%,0);visibility:visible}
.tray span{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .btn{min-height:38px;border-radius:999px;background:var(--green);color:var(--green-ink);padding:0 16px}
.tray .x{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:inherit;opacity:.7;flex:none}

/* ---------- finder ---------- */
.fq{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;margin-bottom:12px}
.fq h3{font-size:17px;display:flex;gap:10px;align-items:baseline}
.fq h3 span{font:700 13px var(--f-disp);color:var(--green)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2);font-size:14px;font-weight:500}
.opts button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--fg)}
.opts button small{display:block;font-size:11px;color:var(--muted);font-weight:400;line-height:1.2}
.res{display:grid;gap:12px;margin-top:20px}
.rcard{display:grid;grid-template-columns:110px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0}
.rcard .stage{height:100%;min-height:130px;padding:8px}
.rcard .bd{padding:12px 12px 12px 0;display:grid;gap:5px;align-content:start;min-width:0}
.rcard .rk{font:700 11px var(--f-disp);letter-spacing:.14em;color:var(--green)}
.rcard .why{font-size:13px;color:var(--muted)}
.rcard .pp{font:700 18px var(--f-disp)}
@media (min-width:760px){.res{grid-template-columns:repeat(3,1fr)}.rcard{grid-template-columns:1fr}.rcard .stage{height:170px}.rcard .bd{padding:0 14px 14px}}

/* ---------- saved ---------- */
.slist{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px}
.srow .stage{height:72px;padding:4px;border-radius:10px}
.srow .stage::after{display:none}
.srow b{font:600 15px/1.3 var(--f-disp)}
.srow .m{font-size:12px;color:var(--muted)}
.srow .pp{font:700 16px var(--f-disp);text-align:right}
.srow button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 0;min-height:30px}
.sumbox{margin-top:16px;display:grid;gap:10px}
.sumbox textarea{width:100%;min-height:180px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:12px;font:13px/1.5 var(--f-mono);resize:vertical}
.contact{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
.contact div{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.contact span{color:var(--muted)}
.contact b{user-select:all}

/* settings popover */
.pop{position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 64px);right:max(16px,env(safe-area-inset-right,0px));width:min(320px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px}
.pop h4{margin:0;font:600 12px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.toast{position:fixed;z-index:90;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-20px);opacity:0;transition:.25s;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.gl-host{position:relative;width:100%;height:100%}
.gl-host canvas{display:block;width:100%!important;height:100%!important}
.hero-gl{position:relative;height:clamp(300px,62vw,460px);margin-top:-36px;cursor:pointer}
.hero-gl .gl-host{position:absolute;inset:0}
.hero-gl .fallback{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:3%}
.hero-gl .fallback img{height:80%;width:auto;object-fit:contain}
.hero-gl.live .fallback{display:none}
.gl-cta{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:600 13px var(--f-body);white-space:nowrap;box-shadow:var(--shadow)}
.gl-cta i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
 .show{display:grid;gap:10px;margin-top:6px}
.show-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.show-tabs .ctabs button{font-size:13px}
.show-tabs .cap{font-size:12px;color:var(--muted)}
.loc{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:13px;min-width:0}
.loc svg{width:18px;height:18px;flex:none;color:var(--ci-blue)}
.loc span{min-width:0;flex:1}
.loc em{font-style:normal;color:var(--blue);font-weight:600;white-space:nowrap;font-size:12px}
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:clamp(92px,24vw,150px);gap:8px}
.bento button{border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--panel-2);position:relative}
.bento img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.bento button:hover img{transform:scale(1.04)}
.bento .b1{grid-column:1 / 4;grid-row:span 2}
.bento .b2{grid-column:1;grid-row:span 2}
.bento .b5{grid-column:2 / 4}
.bento .more{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px}
.site3d{position:relative;height:clamp(320px,72vw,470px);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#a9d3f2 0%,#dcecf6 55%,#eef3f0 100%)}
.site3d .gl-host{position:absolute;inset:0}
.site3d:not(.live){cursor:pointer}
.site3d:not(.live) .gl-hint{font-size:0}
.site3d:not(.live) .gl-hint::before{content:"แตะเพื่อหมุนเอง";font-size:11px}
.fadein{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.autob{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--fg)}
.site3d .gl-hint{color:#33433c;background:rgba(255,255,255,.75);top:auto;bottom:38px}
.site3d .note3d{position:absolute;left:12px;bottom:10px;z-index:2;font-size:11px;color:#33433c;background:rgba(255,255,255,.78);padding:4px 10px;border-radius:99px;pointer-events:none}
@media (min-width:900px){.hero-type .ol{font-size:clamp(54px,6.4vw,100px)}.hero-type .so{font-size:clamp(46px,5.7vw,90px)}.hero-in{grid-template-columns:1fr 1.15fr!important}
.site3d .gl-hint{top:auto;bottom:10px}
.show{grid-column:2;grid-row:1 / span 2;margin-top:0}.bento{grid-auto-rows:118px}.site3d{height:520px}}
.lb img{width:100%;height:auto;display:block;border-radius:12px}
.lb{display:grid;gap:10px;padding-block:14px}
/* contact */
.cgrid{display:grid;gap:16px}
@media (min-width:900px){.cgrid{grid-template-columns:1.25fr 1fr;align-items:start}}
.dark-card{background:#111614;color:#eef3f0;border-radius:20px;padding:24px 20px;display:grid;gap:14px}

.dark-card h2{color:#fff;font-family:var(--f-body);font-weight:600;font-size:clamp(24px,4vw,34px)}
.dark-card p{margin:0;color:#aebcb5;font-size:15px;max-width:60ch}
.dark-card .btn.ghost{border-color:#eef3f0;color:#eef3f0}
.btn.line-g{border-color:#06c755;color:#fff;background:transparent}
.btn.line-g i{width:10px;height:10px;border-radius:50%;background:#06c755}
.btn.ci{background:var(--ci-blue);color:#fff}
.lead{display:grid;gap:14px;margin-top:6px}
.lead label{font-weight:600;font-size:14px;color:#fff;display:grid;gap:8px}
.lead label .req{color:#ff6b6b}
.lead input[type=text],.lead textarea{width:100%;min-height:52px;border-radius:12px;border:1.5px solid #2d3833;background:#fff;color:#0c1512;padding:12px 14px;font:16px var(--f-body)}
.lead textarea{min-height:120px;resize:vertical}
.lead input:focus,.lead textarea:focus{outline:none;border-color:var(--ci-blue);box-shadow:0 0 0 3px rgba(0,137,209,.35)}
.lead .err{border-color:#ff6b6b!important}
.lead .consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13px;color:#c8d3ce;line-height:1.5}

.lead .pk{display:flex;flex-wrap:wrap;gap:6px}
.lead .pk button{min-height:34px;border-radius:99px;border:1px solid #3a4741;background:transparent;color:#dfe7e3;font-size:12px;padding:0 10px}
.lead .pk button[aria-pressed="true"]{background:var(--ci-blue);border-color:var(--ci-blue);color:#fff}
.lead .msg{font-size:14px;padding:12px 14px;border-radius:12px;background:rgba(117,193,136,.16);color:#d8f0de}
.lead .msg.bad{background:rgba(255,107,107,.14);color:#ffd2d2}
.done{display:grid;gap:10px;justify-items:start;padding:18px;border-radius:14px;background:rgba(117,193,136,.14)}
.partner{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plist{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:14px;text-align:left;padding:10px 16px 10px 10px;border-radius:999px;border:2px solid var(--fg);background:var(--panel);min-height:78px;transition:border-color .2s,transform .2s}
.prow:hover{border-color:var(--pa)}
.prow:active{transform:scale(.99)}
.prow .pl{height:58px;border-radius:999px 14px 14px 999px;background:#fff;display:grid;place-items:center;overflow:hidden;padding:4px 8px}
.prow .pl img{max-height:50px;max-width:100%;width:auto;object-fit:contain;display:block}
.prow .pt{display:grid;gap:2px;min-width:0}
.prow .pt b{font:600 16px/1.2 var(--f-disp)}
.prow .pt small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .chev{font-size:26px;line-height:1;color:var(--muted)}
.pdet{display:grid;gap:14px;padding-block:18px}
.evo{display:inline-flex;align-items:baseline;gap:6px;font:700 26px/1 var(--f-disp);color:#f5821f;letter-spacing:-.02em}
.evo small{font:500 12px var(--f-body);color:#333;letter-spacing:0}
.plogo-lg .evo{font-size:56px}.plogo-lg .evo small{font-size:20px}
.prow .pl.fill{padding:4px 6px;background:#304ada}
.prow .pl.fill img{max-height:none;height:100%;width:100%;object-fit:contain}
.prow .evo small{display:none}
.plogo-lg.fill{background:radial-gradient(circle at 50% 50%,#2fa9e8,#3a3fe0 70%);border:0}
.plogo-lg{background:#fff;border-radius:16px;border:1px solid var(--line);height:150px;display:grid;place-items:center;padding:14px}

.pdet .cl{display:grid;gap:10px}

.pdet .tagp{font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--pa);padding:5px 10px;border-radius:99px}
.partner .tagp{font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--ci-blue);padding:5px 10px;border-radius:99px}
.evc{display:inline-flex;align-items:flex-end;font-family:var(--f-disp);line-height:1;background:#fff;border-radius:10px;padding:6px 10px}
.evc b{font-size:30px;font-weight:700;color:#2f5fc4}.evc i{font-style:normal;font-size:30px;font-weight:700;color:#3aa64a;margin-right:2px}
.evc em{font-style:normal;font-size:17px;font-weight:600;color:#2b2f33;margin-bottom:2px}
.partner .cl{display:grid;gap:10px}

.partner .cl a{color:var(--fg)}
.partner .copy{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;font-size:12px;padding:4px 10px;min-height:30px;flex:none}
.leads-admin{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}

const FQ=[
 ["st","ขนาดสถานีที่ต้องการ (Station kW)",TIERS.slice().reverse().map(t=>[t,t+" kW","หม้อแปลง "+trFor(t)+" kVA"]).concat([[0,"ยังไม่ทราบ","ให้ระบบแนะนำ"]])],

 ["pri","ให้ความสำคัญกับอะไรที่สุด",[["fast","ชาร์จเร็วที่สุด","kW ต่อหัวสูง"],["tough","ทนสภาพหนัก","ใกล้ทะเล ฝุ่นเยอะ"],["grow","ขยายได้ภายหลัง","เพิ่มหัวทีหลัง"]]],
];
function recommend(){
  const f=S.f;
  return P.map(o=>{
    let s=0,why=[];
    if(f.st){ if(o.st===f.st){s+=40;why.push(`สถานี ${o.st} kW · หม้อแปลง ${o.tr} kVA`)} else if(o.st<f.st){s+=12} else s-=60; }
    if(f.cars){ const need=f.cars===6?6:f.cars; if(o.o>=need){s+=22-Math.min(12,(o.o-need));if(o.o>=need)why.push(`รับรถพร้อมกัน ${o.o} คัน`)} else s-=30; }
    if(f.bud){ if(vat(o.price)<=f.bud){s+=18} else s-=50; }
    const ppo=o.price/o.o;
    if(f.pri==="fast"){s+=o.max/480*30;if(o.max>=360)why.push(`สูงสุด ${o.max} kW ต่อหัว`)}
    if(f.pri==="cheap"){s+=(1-(ppo-280000)/280000)*30;why.push(`งบลงทุน ${k(ppo)} ต่อหัว`)}
    if(f.pri==="tough"){if(o.brand==="sg"){s+=30;why.push("IP65 + กันกัดกร่อน C5")}}
    if(f.pri==="grow"){const h=headroom(o);if(h>0){s+=Math.min(30,10+h*2);why.push(`เพิ่มได้อีก ${h} หัวโดยไม่เพิ่มตู้ไฟ`)}else if(o.fam==="jup"){s+=20;why.push("เพิ่มตู้ทีละตู้ได้")}}
    return {o,s,why:why.slice(0,3)};
  }).sort((a,b)=>b.s-a.s).slice(0,3);
}

  const f=S.f, done=Object.values(f).filter(v=>v!==null).length;

async function submitLead(e){
  e.preventDefault();
  const g=id=>$(id).value.trim(), msg=$("#leadMsg");
  const v={name:g("#lName"),contact:g("#lContact"),place:g("#lPlace"),note:g("#lNote"),pk:LEAD.pk.slice(),at:Date.now()};
  ["#lName","#lContact"].forEach(id=>$(id).classList.toggle("err",!g(id)));
  if(!v.name||!v.contact){msg.innerHTML='<div class="msg bad">กรอกชื่อ และเบอร์โทร LINE ID หรืออีเมล ก่อนส่ง</div>';return}
  if(!$("#lOk").checked){msg.innerHTML='<div class="msg bad">กรุณาติ๊กยินยอมให้เก็บข้อมูลเพื่อติดต่อกลับ</div>';return}
  const btn=$("#leadBtn"); btn.disabled=true; btn.textContent="กำลังส่ง…";
  const fallback=async(reason)=>{
    const t=leadText(v); let copied=false;
    try{await navigator.clipboard.writeText(t);copied=true}catch(err){}
    msg.innerHTML=`<div class="msg bad">${reason} ${copied?"คัดลอกข้อมูลให้แล้ว กดปุ่มด้านล่างแล้ววางในแชต LINE ได้เลย":"กดค้างที่ข้อความด้านล่างเพื่อคัดลอก แล้วส่งทาง LINE"}</div>
      <textarea readonly style="min-height:110px;margin-top:8px">${esc(t)}</textarea><div class="cta"><a class="btn line-g" href="${LINE_URL}" target="_blank" rel="noopener"><i></i>เปิด LINE เพื่อส่งข้อมูล</a></div>`;
    btn.disabled=false; btn.textContent="ส่งข้อมูล";
  };
  if($("#lHoney").value) return;
  const pkTxt=v.pk.length?v.pk.map(n=>{const o=byN(n);return `Pack ${pad(n)} (${o.st} kW · ${o.o} หัว · ${o.cfg})`}).join(" | "):"-";
  const body={"ชื่อ":v.name,"ติดต่อกลับ":v.contact,"ทำเล/พื้นที่":v.place||"-","แพ็กเกจที่สนใจ":pkTxt,"รายละเอียด":v.note||"-","ส่งเมื่อ":new Date(v.at).toLocaleString("th-TH")};
  try{
    let ok=false;
    if(FORM.web3formsKey){
      const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
        body:JSON.stringify(Object.assign({access_key:FORM.web3formsKey,subject:"ลูกค้าฝากข้อมูล: "+v.name,from_name:"EV Station PluZ Catalog"},body))});
      const j=await r.json().catch(()=>({})); ok=r.ok&&j.success!==false;
    }else{
      const r=await fetch("https://formsubmit.co/ajax/"+(FORM.formsubmitId||FORM.email),{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
        body:JSON.stringify(Object.assign({_subject:"ลูกค้าฝากข้อมูล: "+v.name,_template:"table",_captcha:"false"},body))});
      const j=await r.json().catch(()=>({})); ok=r.ok&&String(j.success)==="true";
      if(!ok){ console.warn("FormSubmit:",r.status,j); if(/activat/i.test(j.message||"")){ btn.disabled=false; btn.textContent="ส่งข้อมูล";
        return fallback("ฟอร์มยังไม่ได้เปิดใช้งาน (เจ้าของเว็บต้องกด Activate ในอีเมลจาก FormSubmit ก่อน)") } }
    }
    if(!ok) throw new Error("send failed");
    LEAD.sent=true; renderContact(); window.scrollTo(0,0); toast("ส่งข้อมูลแล้ว");
  }catch(err){ fallback("ส่งข้อมูลไม่สำเร็จ") }
}

/* ================= ROUTER ================= */
const R={contact:renderContact,home:renderHome,stations:renderStations,models:renderModels,compare:renderCompare,finder:renderFinder,saved:renderSaved};
function route(){
  const h=(location.hash||"#home").slice(1);
  if(/^p-\d+$/.test(h)){ if(!document.querySelector(".view.on")) show(lastView); packDetail(+h.slice(2)); return }
  if(/^m-\w+$/.test(h)){ if(!document.querySelector(".view.on")) show(lastView); modelDetail(h.slice(2)); return }
  if($("#sheet").classList.contains("on")){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on");document.body.style.overflow="";G.unmount()}
  show(R[h]?h:"home");
}
function show(v){
  S.view=v; lastView=v;
  document.querySelectorAll(".view").forEach(el=>el.classList.toggle("on",el.id==="v-"+v));
  if(v!=="home") G.unmount();
  R[v](); renderNav(); renderTray(); window.scrollTo(0,0);
}
function rerender(){R[S.view]();renderNav();renderTray()}
function renderTray(){
  const n=S.cmp.pack.length, t=$("#tray");
  const on=n>0&&S.view!=="compare"&&S.view!=="home";
  t.classList.toggle("on",on);
  $("#trayTxt").textContent=n?`เทียบ ${n}/3: `+S.cmp.pack.map(x=>"Pack "+pad(x)).join(", "):"";
}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  const d=t.dataset;
  if(d.open){e.preventDefault();location.hash=d.open;return}
  if(d.show){ if(d.show==="3d"&&!G.ok){toast("อุปกรณ์นี้ไม่รองรับการแสดงผล 3D");return} setShow(d.show,true); return}
  if(t.id==="autoB"){ S.showAuto=!S.showAuto; showAt=Date.now(); setShow(S.show,false); return}
  if(d.photo!=null){ const i=+d.photo; const order=SITE.slice(i).concat(SITE.slice(0,i));
    openSheet(`<div class="sh-pad lb">${order.map(p=>`<img src="img/${p.f}.webp" alt="${esc(p.alt)}" loading="lazy">`).join("")}<p class="small muted">${esc(SITE_LOC.name)} · ติดตั้งโดย ${esc(CFG.company.th)}</p></div>`,"ภาพสถานีจริง"); return}
  if(d.partner!=null){ const c=PARTNERS[+d.partner]; openSheet(partnerBody(c),c.brand); return}
  if(d.lpk){ const n=+d.lpk,a=LEAD.pk; a.includes(n)?a.splice(a.indexOf(n),1):a.push(n); t.setAttribute("aria-pressed",a.includes(n)); return}
  if(d.media){const box=$("#shBody .gl-box"),gi=$("#shBody .gimgs");if(box&&gi){box.hidden=d.media!=="3d";gi.hidden=d.media==="3d";
    $("#shBody .mtabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.media===d.media))}return}
  if(d.copy){const v=d.copy;try{navigator.clipboard.writeText(v).then(()=>toast("คัดลอกแล้ว: "+v),()=>toast(v))}catch(err){toast(v)}return}
  if(d.tier){S.tier=d.tier;save()}
  if(d.tierv){S.tier=d.tierv;save();renderStations();return}
  if(d.f){S[d.f]=S[d.f]===d.v?"all":d.v;renderStations();return}
  if(d.cmp){const n=+d.cmp, a=S.cmp.pack;
    if(a.includes(n)) a.splice(a.indexOf(n),1); else { if(a.length>=3){toast("เปรียบเทียบได้สูงสุด 3 แพ็กเกจ");return} a.push(n); toast(`เพิ่ม Pack ${pad(n)} ในการเปรียบเทียบ`) }
    S.cmpMode="pack";save(); if(d.re) packDetail(n); rerender(); return}
  if(d.cmpm){const a=S.cmp.model,key=d.cmpm;
    if(a.includes(key)) a.splice(a.indexOf(key),1); else { if(a.length>=3){toast("เปรียบเทียบได้สูงสุด 3 รุ่น");return} a.push(key); toast(`เพิ่ม ${M[key].name} ในการเปรียบเทียบ`) }
    S.cmpMode="model";save(); if(d.re) modelDetail(key); rerender(); return}
  if(d.cmodeGo){S.cmpMode=d.cmodeGo}
  if(d.save){const n=+d.save,a=S.saved;
    if(a.includes(n)){a.splice(a.indexOf(n),1);toast("เอาออกจากรายการที่สนใจแล้ว")}else{a.push(n);toast(`บันทึก Pack ${pad(n)} แล้ว`)}
    save(); if(d.re) packDetail(n); rerender(); return}
  if(d.cmode){S.cmpMode=d.cmode;renderCompare();return}
  if(d.fq){const raw=d.fv, v=isNaN(+raw)?raw:+raw; S.f[d.fq]=S.f[d.fq]===v?null:v; renderFinder(); return}
});
$("#shClose").onclick=closeSheet;
document.addEventListener("click",e=>{const s3=e.target.closest(".site3d"); if(s3&&S.showAuto){S.showAuto=false;setShow("3d",false);toast("หยุดสลับอัตโนมัติ · ลากเพื่อหมุนได้เลย")}});
 $("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").classList.contains("on")) closeSheet()});
$("#trayX").onclick=()=>{S.cmp.pack=[];save();renderTray();rerender()};
// swipe down to close sheet (phone)
(function(){let y0=null,dy=0;const sh=$("#sheet"),top=sh.querySelector(".sh-top");
  const st=e=>{y0=e.touches[0].clientY;dy=0}; const mv=e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0&&innerWidth<760){sh.style.transition="none";sh.style.transform=`translateY(${dy}px)`}};
  const en=()=>{if(y0==null)return;sh.style.transition="";sh.style.transform="";if(dy>90&&innerWidth<760)closeSheet();y0=null};
  [top,sh.querySelector(".grab")].forEach(el=>{el.addEventListener("touchstart",st,{passive:true});el.addEventListener("touchmove",mv,{passive:true});el.addEventListener("touchend",en)})})();
// settings
const pop=$("#pop");
$("#bSet").onclick=e=>{e.stopPropagation();pop.hidden=!pop.hidden;$("#bSet").setAttribute("aria-expanded",!pop.hidden)};
document.addEventListener("click",e=>{if(!pop.hidden&&!pop.contains(e.target)&&e.target!==$("#bSet")) {pop.hidden=true;$("#bSet").setAttribute("aria-expanded","false")}});

function applyTheme(){if(S.theme==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",S.theme);
  $("#themeSeg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===S.theme))}
$("#themeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.theme=b.dataset.t;store.set("theme",S.theme);applyTheme()});
applyTheme();
window.addEventListener("hashchange",route);
route();
})();
</script>
